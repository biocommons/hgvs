name: Python CI/CD

on:
  push:           # branch or tag push on *this* repo
  pull_request:   # PR on *this or forked* repo

jobs:
  python-ci-cd:
    name: Python CI/CD
    # run on all pushes and on PRs from forks;
    # i.e., skip PRs on this repo because their push already triggered CI
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: write   # for gh-pages docs deploy
      id-token: write   # for Codecov OIDC
    uses: biocommons/.github/.github/workflows/python-ci-cd.yml@2
    with:
      # tagged commits (tags) trigger publishing to PyPI and docs
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    secrets:
      # org-level token; PyPI trusted publishing doesn't support reusable
      # workflows yet: https://github.com/pypi/warehouse/issues/11096
      pypi-token: ${{ secrets.UV_PUBLISH_TOKEN }}
