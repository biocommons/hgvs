name: Python CI/CD
permissions:
  contents: write
  id-token: write

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

jobs:
  python-ci-cd:
    name: Python CI/CD
    # run on pushes to any branch in this repo and on pull requests from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: write
      id-token: write
    uses: biocommons/.github/.github/workflows/python-ci-cd.yml@1
    with:
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    secrets:
      pypi-token: ${{ secrets.UV_PUBLISH_TOKEN }}
