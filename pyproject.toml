[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}
zip-safe = true

[tool.setuptools.package-data]
# "*" = ["_data/*/*.json.gz"]
# "*" = ["*.gz", "*.json", "*.yaml"]
"*" = ["_data/*"]

[tool.setuptools.packages.find]
exclude = ["*.pyc", "__pycache__"]
where = ["src"]

[tool.setuptools_scm]

[tool.sphinx-build]
all-files = true

[tool.wheel]
universal = 1
