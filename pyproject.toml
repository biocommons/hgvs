[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 70.1", "setuptools_scm[toml] ~= 8.1"]

[dependency-groups]
dev = [
  "deptry>=0.23",
  "ipython",
  "jupyter",
  "mkdocs-awesome-nav>=3.1.2",
  "mkdocs-material>=9.6",
  "mkdocs>=1.6",
  "mkdocstrings[python]>=0.30",
  "mypy>=1.17",
  "pre-commit>=3.8",
  "pytest-cov>=4.1",
  "pytest-recording",
  "pytest>=7.4,<10.0",
  "ruff>=0.12",
  "sphinx",
  "sphinx_rtd_theme",
  "sphinxcontrib-fulltoc >= 1.1",
  "toml-sort",
  "tox-uv>=1.28",
  "vcrpy",
]

[project]
authors = [
  {email = "biocommons-dev@googlegroups.com", name = "biocommons contributors"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "attrs >= 17.4.0", # https://github.com/biocommons/hgvs/issues/473
  "biocommons.seqrepo >= 0.6.10",
  "bioutils >= 0.4.0,<1.0",
  "importlib_resources",
  "ipython",
  "parsley",
  "psycopg[binary]",
  "psycopg-pool",
  "pyparsing >= 3.1",
]
description = "HGVS Parser, Formatter, Mapper, Validator"
dynamic = ["version"]
keywords = [
  "biocommons",
  "bioinformatics",
  "computational biology",
  "genome variation",
  "genomics",
  "hgvs",
  "variation"
]
license = "Apache-2.0"
name = "hgvs"
readme = "README.md"
requires-python = ">=3.11, <3.14"  # as-of 2025-11-02, PyO3 fails to build pydantic on 3.14

[project.optional-dependencies]
align = ["uta-align~=0.3"]

[project.scripts]
"hgvs-shell" = "hgvs.shell:shell"

[project.urls]
Documentation = "https://hgvs.readthedocs.io/"
Homepage = "https://github.com/biocommons/hgvs/"
Issues = "https://github.com/biocommons/hgvs/issues/"
Repository = "https://github.com/biocommons/hgvs/"

[tool.coverage]

[tool.coverage.report]
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",
]
show_missing = true
skip_empty = true

[tool.coverage.run]
branch = true
omit = [
  "*_test.py",
  "*/test/*",
  "*/tests/*",

  "hgvs/__init__.py",
  "hgvs/dataproviders/interface.py",
  "hgvs/dataproviders/ncbi.py",
  "hgvs/dataproviders/uta.py",
  "hgvs/decorators/*",
  "hgvs/intervalmapper.py",
  "hgvs/shell.py",
  "hgvs/transcriptmapper.py",
  "hgvs/utils/PersistentDict.py",
  "hgvs/utils/context.py",
  "hgvs/utils/orderedenum.py"
]
source = ["src"]

[tool.deptry]

[tool.deptry.package_module_name_map]
# map package name to import name
# Making this explicit suppresses deptry notices
coloredlogs = "coloredlogs"
mkdocs = "mkdocs"
mkdocs-material = "mkdocs_material"
mkdocstrings = "mkdocstrings"
mypy = "mypy"
pre-commit = "pre_commit"
pytest = "pytest"
pytest-cov = "pytest_cov"
pyyaml = "yaml"
ruff = "ruff"
tox-uv = "tox_uv"
ty = "ty"

[tool.pytest.ini_options]
addopts = "-s -v -x --strict-markers -m 'not extra' --doctest-modules --cov=src"
doctest_optionflags = [
  "ALLOW_BYTES",
  "ALLOW_UNICODE",
  "ELLIPSIS",
  "IGNORE_EXCEPTION_DETAIL",
  "NORMALIZE_WHITESPACE"
]
markers = [
  "network: tests that require network connectivity",
  "slow: slow tests that should be run infrequently",

  "extra",
  "issues",
  "mapping",
  "models",
  "normalization",
  "quick",
  "regression",
  "validation",
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/hgvs/parsers/generated"]
fix = true
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
preview = true
quote-style = "double"

[tool.ruff.lint]
fixable = [
  "B",
  "C4",
  "D",
  "EM",
  "F401",
  "F541",
  "I",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "UP"
]
ignore = [
  "E111",
  "E114",
  "E117",
  "E501",
  "E731",
  "N801",
  "N802",
  "PLR0913",
  "RET504",
  "S321",
  "W191",
]
select = [
  "A", # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
  "ARG", # https://docs.astral.sh/ruff/rules/#flake8-unused-arguments-arg
  "B", # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "C4", # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
  "DTZ", # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
  "E",
  "EM", # https://docs.astral.sh/ruff/rules/#flake8-errmsg-em
  "F", # https://docs.astral.sh/ruff/rules/#pyflakes-f
  "G", # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
  "I", # https://docs.astral.sh/ruff/rules/#isort-i
  "LOG", # https://docs.astral.sh/ruff/rules/#flake8-logging-log
  "N", # https://docs.astral.sh/ruff/rules/#pep8-naming-n
  "PERF", # https://docs.astral.sh/ruff/rules/#perflint-perf
  "PIE", # https://docs.astral.sh/ruff/rules/#flake8-pie-pie
  "PL", # https://docs.astral.sh/ruff/rules/#pylint-pl
  "PT", # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
  "PTH", # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
  "RET", # https://docs.astral.sh/ruff/rules/#flake8-return-ret
  "RSE", # https://docs.astral.sh/ruff/rules/#flake8-raise-rse
  "RUF", # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
  "S", # https://docs.astral.sh/ruff/rules/#flake8-bandit-s
  "SIM", # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
  "TRY", # https://docs.astral.sh/ruff/rules/#tryceratops-try
  "UP", # https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "W", # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
  "YTT" # https://docs.astral.sh/ruff/rules/#flake8-2020-ytt
]

