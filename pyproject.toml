[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 70.1", "setuptools_scm[toml] ~= 8.1"]

[dependency-groups]
dev = [
  "deptry>=0.23",
  "ipython",
  "jupyter",
  "mkdocs-awesome-nav>=3.1.2",
  "mkdocs-material>=9.6",
  "mkdocs>=1.6",
  "mkdocstrings[python]>=0.30",
  "mypy>=1.17",
  "pre-commit>=3.8",
  "pytest-cov>=4.1",
  "pytest-recording",
  "pytest>=7.4,<10.0",
  "ruff>=0.12",
  "sphinx",
  "sphinx_rtd_theme",
  "sphinxcontrib-fulltoc >= 1.1",
  "toml-sort",
  "tox-uv>=1.28",
  "vcrpy",
]

[project]
authors = [
  {email = "biocommons-dev@googlegroups.com", name = "biocommons contributors"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "attrs >= 17.4.0", # https://github.com/biocommons/hgvs/issues/473
  "biocommons.seqrepo >= 0.6.10",
  "bioutils >= 0.4.0,<1.0",
  "importlib_resources",
  "ipython",
  "parsley",
  "psycopg[binary]",
  "psycopg-pool",
  "pyparsing >= 3.1",
]
description = "HGVS Parser, Formatter, Mapper, Validator"
dynamic = ["version"]
keywords = [
  "biocommons",
  "bioinformatics",
  "computational biology",
  "genome variation",
  "genomics",
  "hgvs",
  "variation"
]
license = "Apache-2.0"
name = "hgvs"
readme = "README.md"
requires-python = ">=3.11, <3.14"  # as-of 2025-11-02, PyO3 fails to build pydantic on 3.14

[project.optional-dependencies]
align = ["uta-align~=0.3"]

[project.scripts]
"hgvs-shell" = "hgvs.shell:shell"

[project.urls]
Documentation = "https://hgvs.readthedocs.io/"
Homepage = "https://github.com/biocommons/hgvs/"
Issues = "https://github.com/biocommons/hgvs/issues/"
Repository = "https://github.com/biocommons/hgvs/"

[tool.coverage]

[tool.coverage.report]
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",
]
show_missing = true
skip_empty = true

[tool.coverage.run]
branch = true
omit = [
  "*_test.py",
  "*/test/*",
  "*/tests/*",

  "hgvs/__init__.py",
  "hgvs/dataproviders/interface.py",
  "hgvs/dataproviders/ncbi.py",
  "hgvs/dataproviders/uta.py",
  "hgvs/decorators/*",
  "hgvs/intervalmapper.py",
  "hgvs/shell.py",
  "hgvs/transcriptmapper.py",
  "hgvs/utils/PersistentDict.py",
  "hgvs/utils/context.py",
  "hgvs/utils/orderedenum.py"
]
source = ["src"]

[tool.deptry]

[tool.deptry.package_module_name_map]
# map package name to import name
# Making this explicit suppresses deptry notices
coloredlogs = "coloredlogs"
mkdocs = "mkdocs"
mkdocs-material = "mkdocs_material"
mkdocstrings = "mkdocstrings"
mypy = "mypy"
pre-commit = "pre_commit"
pytest = "pytest"
pytest-cov = "pytest_cov"
pyyaml = "yaml"
ruff = "ruff"
tox-uv = "tox_uv"
ty = "ty"

[tool.pytest.ini_options]
addopts = "-s -v -x --strict-markers -m 'not extra and not network' --doctest-modules --cov=src"
doctest_optionflags = [
  "ALLOW_BYTES",
  "ALLOW_UNICODE",
  "ELLIPSIS",
  "IGNORE_EXCEPTION_DETAIL",
  "NORMALIZE_WHITESPACE"
]
markers = [
  "network: uncachable tests that always require network connectivity",
  "slow: slow tests that should be run infrequently",

  "extra",
  "issues",
  "mapping",
  "models",
  "normalization",
  "quick",
  "regression",
  "validation",
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/hgvs/parsers/generated"]
fix = true
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
preview = true
quote-style = "double"

[tool.ruff.lint]
fixable = [
  "B",
  "C4",
  "D",
  "EM",
  "F401",
  "F541",
  "I",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "UP"
]
ignore = [
  "E111",
  "E114",
  "E117",
  "E501",
  "E731",
  "N801",
  "N802",
  "PLR0913",
  "RET504",
  "S321",
  "W191",
]
select = [
  "A", # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
  "ARG", # https://docs.astral.sh/ruff/rules/#flake8-unused-arguments-arg
  "B", # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "C4", # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
  "DTZ", # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
  "E",
  "EM", # https://docs.astral.sh/ruff/rules/#flake8-errmsg-em
  "F", # https://docs.astral.sh/ruff/rules/#pyflakes-f
  "G", # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
  "I", # https://docs.astral.sh/ruff/rules/#isort-i
  "LOG", # https://docs.astral.sh/ruff/rules/#flake8-logging-log
  "N", # https://docs.astral.sh/ruff/rules/#pep8-naming-n
  "PERF", # https://docs.astral.sh/ruff/rules/#perflint-perf
  "PIE", # https://docs.astral.sh/ruff/rules/#flake8-pie-pie
  "PL", # https://docs.astral.sh/ruff/rules/#pylint-pl
  "PT", # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
  "PTH", # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
  "RET", # https://docs.astral.sh/ruff/rules/#flake8-return-ret
  "RSE", # https://docs.astral.sh/ruff/rules/#flake8-raise-rse
  "RUF", # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
  "S", # https://docs.astral.sh/ruff/rules/#flake8-bandit-s
  "SIM", # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
  "TRY", # https://docs.astral.sh/ruff/rules/#tryceratops-try
  "UP", # https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "W", # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
  "YTT" # https://docs.astral.sh/ruff/rules/#flake8-2020-ytt
]

[tool.ruff.lint.per-file-ignores]
# https://github.com/biocommons/hgvs/issues/838
# S101 (assert) is a permanent exception here, not debt: pytest rewrites
# assert for readable failures and test runs aren't executed with -O, so
# the rule's rationale (asserts stripped in optimized production code)
# doesn't apply. See https://github.com/biocommons/hgvs/issues/850.
"tests/*" = ["PLR2004", "S101"]
"src/hgvs/alignmentmapper.py" = ["PLR0911", "PLR0912", "PLR0915", "S101"]
"src/hgvs/assemblymapper.py" = ["S101"]
"src/hgvs/dataproviders/interface.py" = ["PLR2004", "S101"]
# ARG002 (cache, unused in NCBIBase.__init__): required by the shared
# dataprovider __init__(mode, cache) signature (see interface.py,
# uta.py) so backends stay interchangeable; not dead code. See #850.
"src/hgvs/dataproviders/ncbi.py" = ["ARG002", "PLR2004"]
# PLC0415: SeqRepo/SeqRepoRESTDataProxy are imported inside their
# respective HGVS_SEQREPO_DIR/HGVS_SEQREPO_URL branches so the unused
# backend's import cost isn't paid when neither env var is set. See #850.
"src/hgvs/dataproviders/seqfetcher.py" = ["PLC0415"]
"src/hgvs/dataproviders/uta.py" = ["PLR2004"]
# A002/B006/B008/N806 here are a verbatim port of CPython's lru_cache
# backport recipe (see module docstring); the builtin-shadowing default
# args (sorted=sorted, etc.) and UPPERCASE tuple-unpacked names are a
# deliberate perf idiom from the reference implementation, not sloppiness.
# Permanent exception, not debt. See #850.
"src/hgvs/decorators/lru_cache.py" = ["A002", "B006", "B008", "N806", "PLR0915"]
# ARG002 (conf/ilen, unused in base Edit.format/_del_ins_lengths):
# these are abstract-ish base methods with real implementations in
# subclasses; the params must stay for signature compatibility across
# polymorphic calls. Not dead code. See #850.
"src/hgvs/edit.py" = ["ARG002", "PLR0912", "S101"]
# ARG002 (conf, unused in SimplePosition/BaseOffsetPosition.format):
# same polymorphic .format(conf) protocol as edit.py above.
# N805: comparison dunders (__eq__, __lt__, __sub__, etc.) use lhs/rhs
# instead of self/other -- deliberate, since they assert both operands
# are the same type and treat them symmetrically; lhs/rhs signals that.
# PLW1641: SimplePosition/BaseOffsetPosition/AAPosition define __eq__ but
# are mutable value objects (_set_uncertain mutates in place), so no
# __hash__ is provided -- adding one on a mutable type risks silent
# set/dict corruption if an instance changes after insertion. Nothing
# hashes these today; permanent exception, not debt. See #850.
"src/hgvs/location.py" = ["ARG002", "N805", "PLR0911", "PLR0912", "PLW1641", "S101", "TRY300"]
"src/hgvs/normalizer.py" = ["PLR0912", "PLR0915", "PLR2004", "S101", "TRY300"]
# ARG004 (kwargs, unused in Parser.__new__): Python's object-construction
# protocol calls __new__ with the same args as __init__; __new__ must
# accept and discard kwargs meant for __init__.
# PLC0415: each backend module (parsley_parser/pyparsing_parser) is
# imported only when that backend is actually selected in __new__, so
# callers using only one backend don't pay the other's import cost.
# Not dead code. See #850.
"src/hgvs/parsers/base.py" = ["ARG004", "PLC0415"]
# ARG002 (grammar_fn, unused in PyParsingParser._build_grammar):
# overrides Parser._build_grammar(grammar_fn), called uniformly from
# base.py regardless of backend; ParsleyParser's override does use it.
# Not dead code. See #850.
"src/hgvs/parsers/pyparsing_parser.py" = ["ARG002"]
"src/hgvs/pretty/console/protseqrenderer.py" = ["PLR0912", "PLR0915"]
"src/hgvs/pretty/console/shuffledvariant.py" = ["PLR0912", "PLR0915"]
"src/hgvs/pretty/console/txaligrenderer.py" = ["PLR0912", "PLR0915"]
"src/hgvs/pretty/datacompiler.py" = ["PLR0912", "PLR0915", "PLR2004"]
"src/hgvs/pretty/prettyprint.py" = ["PLR0912", "PLR0915"]
"src/hgvs/repeats.py" = ["PLR0912", "PLR0915"]
# PLC0415: hgvs.easy and hgvs.utils.context are imported inside shell()
# specifically because importing them eagerly connects to the UTA
# database (see #867) -- module-level imports would defeat the point
# of deferring that connection until the shell actually starts. See #850.
"src/hgvs/shell.py" = ["PLC0415"]
# S301 (pickle) fix is blocked on #849's planned rethink of hdp caching
# for 2.0; not fixing here to avoid throwaway work. N999 (module name)
# is likewise left as-is pending that rework.
"src/hgvs/utils/PersistentDict.py" = ["N999", "S301"]
"src/hgvs/utils/altseq_to_hgvsp.py" = ["PLR0912", "PLR0915"]
# PLC0415: this module's docstring says it's experimental and requires
# uta_align, which is NOT a standard hgvs dependency (see
# [project.optional-dependencies] align); importing it locally avoids
# a hard import-time dependency for a module most installs never use.
"src/hgvs/utils/context.py" = ["PLC0415", "PLR2004", "S101"]
"src/hgvs/utils/norm.py" = ["PLR2004"]
"src/hgvs/utils/orderedenum.py" = ["S101"]
"src/hgvs/utils/position.py" = ["PLR0911", "PLR0912"]
"src/hgvs/utils/validation.py" = ["S101"]
"src/hgvs/validator.py" = ["S101"]
"src/hgvs/variantmapper.py" = ["PLR0912", "PLR0915"]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}
zip-safe = true

[tool.setuptools.package-data]
# "*" = ["_data/*/*.json.gz"]
# "*" = ["*.gz", "*.json", "*.yaml"]
"*" = ["_data/*"]

[tool.setuptools.packages.find]
exclude = ["*.pyc", "__pycache__"]
where = ["src"]

[tool.setuptools_scm]

[tool.sphinx-build]
all-files = true

[tool.wheel]
universal = 1
